<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Theeradech Srisawat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; 
      padding: 0; 
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white; 
      text-align: center;
    }

    nav { 
      margin: 20px; 
      display: flex; 
      justify-content: center; 
      gap: 20px; 
    }

    nav a { 
      color: white; 
      text-decoration: none; 
      transition: 0.3s; 
      font-weight: 500;
    }

    nav a:hover { 
      color: #ffd700; 
    }

    h1 {
      margin-top: 20px;
      font-size: 2rem;
      color: #ffd700;
    }

    form {
      background: rgba(255,255,255,0.1);
      padding: 30px; 
      border-radius: 20px;
      max-width: 400px; 
      margin: 50px auto; 
      backdrop-filter: blur(8px);
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    input, textarea {
      width: 100%; 
      padding: 12px; 
      margin: 12px 0;
      border: none; 
      border-radius: 10px; 
      outline: none;
      font-size: 1rem;
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    input::placeholder, textarea::placeholder {
      color: #ddd;
    }

    button {
      background: #ffd700; 
      border: none; 
      padding: 12px 30px;
      border-radius: 20px; 
      font-weight: 600; 
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }

    button:hover { 
      background: #fff; 
      color: #333; 
    }

    @media (max-width: 480px) {
      form {
        margin: 30px 20px;
        padding: 20px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Contact Me</h1>
  
  <form action="https://formspree.io/f/mjkazvwp" method="POST">
    <input type="text" name="name" placeholder="Your Name" required />
    <input type="email" name="email" placeholder="Your Email" required />
    <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</body>
</html>
