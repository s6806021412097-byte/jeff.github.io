<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Theeradech Srisawat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white; text-align: center;
    }
    nav { margin: 20px; display: flex; justify-content: center; gap: 20px; }
    nav a { color: white; text-decoration: none; transition: 0.3s; }
    nav a:hover { color: #ffd700; }
    form {
      background: rgba(255,255,255,0.1);
      padding: 30px; border-radius: 20px;
      max-width: 400px; margin: 50px auto; backdrop-filter: blur(8px);
    }
    input, textarea {
      width: 100%; padding: 10px; margin: 10px 0;
      border: none; border-radius: 10px; outline: none;
    }
    button {
      background: #ffd700; border: none; padding: 10px 25px;
      border-radius: 20px; font-weight: 600; cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #fff; color: #333; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Contact Me</h1>
  <form>
    <input type="text" placeholder="Your Name" required />
    <input type="email" placeholder="Your Email" required />
    <textarea rows="4" placeholder="Your Message"></textarea>
    <button type="submit">Send Message</button>
  </form>
</body>
</html>
