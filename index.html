<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theeradech Srisawat | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0; padding: 0; height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      overflow: hidden;
    }

    nav {
      position: absolute; top: 20px;
      display: flex; gap: 20px;
    }

    nav a {
      color: white; text-decoration: none; font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover { color: #ffd700; }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 40px; border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      max-width: 500px;
      animation: fadeIn 1.5s ease-in-out;
    }

    img.profile {
      width: 150px; height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffd700;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255,215,0,0.5);
      opacity: 0;
      animation: fadeUp 1.5s ease-out forwards;
    }

    h1 {
      font-size: 2.2rem;
      margin: 10px 0;
      color: #ffd700;
      animation: fadeUp 2s ease-out forwards;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 20px;
      animation: fadeUp 2.5s ease-out forwards;
    }

    /* เอฟเฟกต์ fade */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* เอฟเฟกต์พิมพ์ชื่อ */
    .typewriter {
      display: inline-block;
      border-right: 3px solid #ffd700;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      animation: typing 3s steps(30, end) forwards, blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: #ffd700; }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="box">
    <img src="me.jpg" alt="Theeradech Srisawat" class="profile" />

    <h1>Hello, I'm <span id="name" class="typewriter"></span></h1>
    <p>Welcome to my personal website 🌟</p>
  </div>

  <script>
    // JavaScript สำหรับพิมพ์ชื่อทีละตัว
    const text = "Theeradech Srisawat";
    const target = document.getElementById("name");

    let i = 0;
    function typeWriter() {
      if (i < text.length) {
        target.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 100); // ความเร็วในการพิมพ์ (มิลลิวินาที)
      }
    }
    window.onload = typeWriter;
  </script>
</body>
</html>
